name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned sideloadable IPA
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v6
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Check block operations and source positions
        run: |
          set -euo pipefail
          {
            cat HeyNote/NoteDocument.swift HeyNote/SourceLineMap.swift
            cat <<'SWIFT'
          let original = try Data(contentsOf: URL(fileURLWithPath: "../README.md"))
          let note = try NoteDocument(data: original)
          let roundtrip = try note.data(forSaving: false)
          precondition(roundtrip == original)
          let first = note.blocks[0]
          var changed = note
          guard let duplicate = changed.duplicateBlock(first.id) else { fatalError("Block duplication failed") }
          precondition(changed.blocks.count == note.blocks.count + 1)
          precondition(changed.blocks.first(where: { $0.id == duplicate })?.text == first.text)
          precondition(changed.moveBlock(duplicate, to: 0))
          precondition(changed.blocks[0].id == duplicate)
          let encoded = try changed.data(forSaving: true)
          let parsed = try NoteDocument(data: encoded)
          precondition(parsed.blocks.count == changed.blocks.count)
          precondition(parsed.blocks.map(\.text) == changed.blocks.map(\.text))
          precondition(changed.removeBlock(first.id))
          precondition(changed.blocks.first(where: { $0.id == duplicate })?.text == first.text)
          for id in changed.blocks.map(\.id) { precondition(changed.removeBlock(id)) }
          precondition(changed.blocks.count == 1 && changed.blocks[0].text.isEmpty)
          let lines = SourceLineMap(first.text)
          for offset in 0...first.text.utf16.count {
              precondition(abs(lines.offset(at: lines.line(at: offset)) - offset) <= 1)
          }
          print("Block operations and source positions verified.")
          SWIFT
          } | swift -
      - name: Archive for iPhone and iPad
        run: |
          set -euo pipefail
          xcodebuild -project HeyNote.xcodeproj -scheme HeyNote \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/HeyNote.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" archive
      - name: Package IPA for signing by a sideloading tool
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/HeyNote.xcarchive/Products/Applications/HeyNote.app build/Payload/
          plutil -lint build/Payload/HeyNote.app/Info.plist
          test -x build/Payload/HeyNote.app/HeyNote
          lipo build/Payload/HeyNote.app/HeyNote -verify_arch arm64
          cd build
          /usr/bin/zip -q -r HeyNote-unsigned.ipa Payload
          /usr/bin/unzip -tq HeyNote-unsigned.ipa
          shasum -a 256 HeyNote-unsigned.ipa > HeyNote-unsigned.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeyNote-iOS-unsigned
          path: |
            ios/build/HeyNote-unsigned.ipa
            ios/build/HeyNote-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
