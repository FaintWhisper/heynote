name: HeyNote
options:
  bundleIdPrefix: com.faintwhisper
  preGenCommand: |
    set -eu
    for size in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
      sips -z "$size" "$size" AppIcon.png --out "HeyNote/Assets.xcassets/AppIcon.appiconset/icon-${size}.png" > /dev/null
    done
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '1.0.11'
    CURRENT_PROJECT_VERSION: '1'
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: '2.4.1'
  CMark:
    url: https://github.com/swiftlang/swift-cmark
    from: '0.4.0'
targets:
  HeyNote:
    type: application
    platform: iOS
    sources:
      - HeyNote
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: CMark
        product: cmark-gfm
      - package: CMark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faintwhisper.heynote.ios
        INFOPLIST_FILE: HeyNote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  HeyNote:
    build:
      targets:
        HeyNote: all
    archive:
      config: Release
